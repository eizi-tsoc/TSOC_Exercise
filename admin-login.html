<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSOC Exercise 管理者ログイン</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Yu Gothic",sans-serif;background:#f3f6f8;color:#1d2730}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(430px,94vw);background:#fff;border:1px solid #d7e0e7;border-radius:12px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:#607080;margin-bottom:22px}
label{display:block;font-size:13px;font-weight:700}input{width:100%;margin-top:7px;padding:11px;border:1px solid #c9d4de;border-radius:7px;font-size:16px}
.actions{display:flex;gap:8px;margin-top:18px}.actions button,.actions a{flex:1;text-align:center;padding:10px;border-radius:7px;text-decoration:none;border:1px solid #c6d1da;background:#fff;color:#24313b;cursor:pointer}
.actions .primary{background:#126da3;color:#fff;border-color:#126da3}.msg{min-height:22px;margin-top:12px;font-size:13px;color:#b32020}
.note{font-size:12px;color:#667680;margin-top:18px}
</style>
</head>
<body>
<div class="login-wrap">
  <form id="loginForm" class="login-card">
    <h1>TSOC Exercise 管理者ページ</h1>
    <div class="sub">管理画面へ入るにはパスワードを入力してください。</div>
    <label>パスワード
      <input id="password" type="password" autocomplete="current-password" autofocus>
    </label>
    <div id="msg" class="msg"></div>
    <div class="actions">
      <a href="index.html">選択画面へ戻る</a>
      <button class="primary" type="submit">ログイン</button>
    </div>
    <div class="note">初期パスワード：admin<br>管理画面の「管理者設定」から変更できます。</div>
  </form>
</div>
<script src="admin-auth.js"></script>
<script>
if(TSOC_ADMIN_AUTH.isAuthenticated()) location.replace("admin.html");
document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=e.submitter;btn.disabled=true;btn.textContent="確認中…";
  const ok=await TSOC_ADMIN_AUTH.login(document.getElementById("password").value);
  if(ok) location.replace("admin.html");
  else{
    document.getElementById("msg").textContent="パスワードが違います。";
    btn.disabled=false;btn.textContent="ログイン";
  }
});
</script>
</body></html>
