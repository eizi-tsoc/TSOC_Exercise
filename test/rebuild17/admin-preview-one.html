<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSOC Exercise 表示確認</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#222}
.wrap{max-width:1100px;margin:24px auto;padding:0 18px}
h1{font-size:22px;margin:0 0 10px}
.note{font-size:13px;color:#555;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:white;border:1px solid #d7dde2;border-radius:10px;padding:16px}
.panel h2{font-size:17px;margin:0 0 12px}
.exercise-card img,.print-slot img{width:100%;height:320px;object-fit:contain;background:#fff}
.meta{margin-top:10px;line-height:1.55}
.print-sheet{aspect-ratio:297/210;background:#fff;border:1px solid #cbd3d9;padding:18px;box-sizing:border-box}
.print-slot{height:100%;border:1px solid #d8dfe4;padding:14px;box-sizing:border-box;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>表示確認</h1>
  <div class="note">同じ完成画像・同じ運動情報を使用しています。左は通常画面相当、右はA4印刷時の1運動枠相当です。</div>
  <div class="grid">
    <section class="panel">
      <h2>通常画面での見え方</h2>
      <div id="normal"></div>
    </section>
    <section class="panel">
      <h2>印刷時の見え方</h2>
      <div class="print-sheet"><div id="print" class="print-slot"></div></div>
    </section>
  </div>
</div>
<script>
const raw=sessionStorage.getItem("tsoc_admin_phase4_preview_one_v1");
if(!raw){document.body.innerHTML="<p>表示データがありません。</p>";throw new Error("no preview payload");}
const p=JSON.parse(raw),e=p.exercise;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\"":"&quot;","'":"&#39;"}[m]));
const img=p.imageDataUrl || `assets/preview-completed/${String(e.id).toLowerCase()}_completed.png`;
document.getElementById("normal").innerHTML=
`<div class="exercise-card"><img src="${img}"><div class="meta"><strong>${esc(e.id)} ${esc(e.name)}</strong><br>${esc(e.purpose||"")}<br>${esc(e.description||"")}</div></div>`;
const printImg=p.imageDataUrl || `assets/print-completed/${String(e.id).toLowerCase()}_completed.png`;
document.getElementById("print").innerHTML=
`<strong>${esc(e.name)}</strong><div>${esc(e.purpose||"")}</div><img src="${printImg}"><div>${esc(e.description||"")}</div>`;
</script>
</body>
</html>
