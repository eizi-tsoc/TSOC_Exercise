<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSOC 印刷イメージ確認</title>
<link rel="stylesheet" href="styles.css?v=2.0.4-b004">
<style>
body{margin:0;background:#fff}
.preview-build-badge{position:fixed;right:10px;top:8px;z-index:9999;font:12px/1.2 sans-serif;background:#fff;border:1px solid #bbb;border-radius:5px;padding:4px 7px}
.print-page{margin:0 auto!important}
.print-qr{width:26mm;height:26mm;display:flex;align-items:center;justify-content:center;overflow:hidden}
.print-qr img{display:block!important;width:26mm!important;height:26mm!important;max-width:26mm!important;max-height:26mm!important;object-fit:contain;background:#fff}
@media print{.preview-build-badge{display:none!important}}
</style>
</head>
<body>
<div class="preview-build-badge">v2.0.4 / Build 004</div>
<div id="stage">プレビューデータを待っています…</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
window.renderTsocAdminPreview=function(e){
  const img=e.imageDataUrl||e.imagePath||"";
  const qr=e.qr?`<div class="print-qr"><img src="${e.qr}" alt="QRコード"></div>`:"";
  const ex=`<article class="print-ex">
  <div class="print-title"><span>種目：</span><strong>${esc(e.name)}</strong></div>
  <div class="print-purpose-row"><div class="print-purpose">${esc(e.purpose)}</div><div class="print-dose"></div></div>
  <div class="print-media"><div class="print-pictures"><div class="print-completed-stack"><img class="print-completed-image" src="${img}"></div></div>${qr}</div>
  <div class="print-description">${esc(e.description)}</div>
  </article>`;
  const empty=()=>`<article class="print-empty"><div class="empty-grid"><div class="empty-logo">TSOC<span>◆</span></div><div class="empty-mark">TSOC</div></div></article>`;
  document.getElementById("stage").innerHTML=`<section class="print-page">
  <header class="print-head"><div class="print-brand">TSOC_エクササイズパンフレット</div><div class="print-patient"><span>氏名</span><strong></strong><span>様</span></div><img class="print-brand-logo" src="assets/branding/tsoc-logo.png"></header>
  <div class="print-grid">${ex}${empty()}${empty()}${empty()}</div>
  <footer>Copyright © 2023 TSOC. All Rights Reserved.</footer></section>`;
};
</script>
</body>
</html>
