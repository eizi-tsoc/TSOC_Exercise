<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSOC Exercise</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div><h1>TSOC Exercise</h1><p>自主トレーニング指導メニュー</p></div><div class="version">Web v1.1.0</div></header>
<div class="app-shell">
<aside class="sidebar"><section><h2>カテゴリー</h2><button class="nav active" data-cat="ALL">すべて</button><div id="categoryNav"></div></section></aside>
<main>
  <div class="toolbar"><input id="search" placeholder="運動名・目的・説明から検索"><div class="counter"><strong id="count">0</strong> / 8 種目</div></div>
  <div id="notice" class="notice hidden"></div><div id="exerciseGrid" class="exercise-grid"></div>
</main>
<aside class="selection-panel"><h2>選択中の運動</h2><div id="selectionList"></div>
  <label class="field"><span>患者名</span><input id="patientName" autocomplete="off"></label>
  <div class="actions"><button id="clearBtn" class="secondary">選択解除</button><button id="previewBtn" class="secondary">印刷プレビュー</button><button id="printBtn" class="primary">印刷 / PDF</button></div>
</aside></div>
<div id="previewBackdrop" class="preview-backdrop hidden"><div class="preview-toolbar"><button id="closePreview" class="secondary">戻る</button><button id="previewPrint" class="primary">印刷 / PDF</button></div><div id="previewView" class="preview-view"></div></div>
<div id="printView" class="print-view"></div>
<script src="data/exercise-data.js"></script><script src="app.js"></script></body></html>
